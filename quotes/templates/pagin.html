{% if is_paginated %}
  <div class="row">
    <div class="col-sm-3 offset-sm-9">
      <form class="d-flex" method="GET" action="{{ request.path }}">
        <div class="input-group">
          <a class="btn {% if not page_obj.has_previous %}btn-secondary disabled{% else %}btn-info{% endif %}"
            {% if page_obj.has_previous %}
              href="{{ request.path }}?page={{ page_obj.previous_page_number }}"
            {% endif %}
          >←</a>

          <input type="text" class="form-control" name="page" value="{{ page_obj.number }}" />
          <span class="input-group-text">sur {{ page_obj.paginator.num_pages }}</span>

          <a class="btn btn-info {% if not page_obj.has_next %}disabled{% endif %}"
            {% if page_obj.has_next %}
              href="{{ request.path }}?page={{ page_obj.next_page_number }}"
            {% endif %}
          >→</a>
        </div>
      </form>
    </div>
  </div>
{% endif %}
