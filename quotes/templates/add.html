{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Ajouter une citation{% endblock %}
{% block content %}
  <div class="max-w-2xl bg-white p-6 rounded shadow">
    <form method="POST" action="">
       {% csrf_token %}
       {{ form|crispy }}
       <div class="mt-6">
         <input class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded font-bold cursor-pointer" type="submit" value="Soumettre" />
       </div>
    </form>
  </div>
{% endblock %}
