{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Inscription{% endblock %}
{% block content %}
    <p>La création d'un compte vous permettra d'ajouter des citations, de
    voter pour vos citations favorites et bien plus encore !</p>
    <div class="row">
      <form method="POST" action="">
        <div class="col-md-6">
          {% csrf_token %}
          {{ form|crispy }}
          <input type="submit" class="btn btn-primary" value="S'enregistrer" />
        </div>
      </form>
    </div>
{% endblock %}
